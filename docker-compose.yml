
services:
  db:
    image: postgres:15-alpine
    container_name: opsmind-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lenin_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required (define it in .env)}
      POSTGRES_DB: ${POSTGRES_DB:-opsmind_db}

    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  api:
    build: .
    container_name: opsmind-api
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - db
    environment:
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required (define it in .env)}
      DATABASE_URL: postgresql://${POSTGRES_USER:-lenin_dev}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:-opsmind_db}?schema=public
      DIRECT_URL: postgresql://${POSTGRES_USER:-lenin_dev}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:-opsmind_db}?schema=public
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}

volumes:
  db_data:
