name: CI/CD - OpsMind

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  test:
    runs-on: ubuntu-latest

    # 1. Variables globales unificadas que coinciden exactamente con el servicio
    env:
      DATABASE_URL: "postgresql://test_user:test_password@localhost:5432/monitor_test_db?schema=public"
      DIRECT_URL: "postgresql://test_user:test_password@localhost:5432/monitor_test_db?schema=public"
      JWT_SECRET: "super_secreto_para_entorno_de_pruebas"
      GEMINI_API_KEY: "test_dummy_key"
      PORT: "3000"

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: monitor_test_db
        ports:
          - 5432:5432
        # Aseguramos que GitHub espere a que PostgreSQL esté listo
        options: >-
          --health-cmd "pg_isready -U test_user -d monitor_test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate prisma client
        run: npx prisma generate

      # Fail-fast fallos de compilación/tipado antes de gastar tiempo en la suite
      - name: Typecheck (src + tests)
        run: npm run typecheck

      - name: Build production bundle
        run: npm run build

      # 2. Paso activo: Esto viaja a la DB temporal vacía y crea la tabla Monitor
      - name: Push Prisma schema to test database
        run: npx prisma db push

      # 3. Jest ejecuta las pruebas encontrando las tablas listas
      - name: Run test suite
        run: npm test

  # 4. CD: sólo en push a main y con el CI verde.
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: test
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false

    env:
      # Conexión DIRECTA (IPv4, puerto 5432) de Supabase para `migrate deploy`
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate prisma client
        run: npx prisma generate

      # 5. Aplica las migraciones pendientes a producción (idempotente; no-op si ya están)
      - name: Deploy migrations to production (Supabase)
        run: npx prisma migrate deploy

      # 6. Dispara el rebuild/rollout de la API en Render usando el Dockerfile del repo.
      #    El CMD del contenedor también corre `migrate deploy` (no-op si ya aplicado).
      - name: Trigger Render deploy via webhook
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"