name: CI - OpsMind

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  test:
    runs-on: ubuntu-latest

    # 1. Variables globales unificadas que coinciden exactamente con el servicio
    env:
      DATABASE_URL: "postgresql://test_user:test_password@localhost:5432/monitor_test_db?schema=public"
      DIRECT_URL: "postgresql://test_user:test_password@localhost:5432/monitor_test_db?schema=public"
      JWT_SECRET: "super_secreto_para_entorno_de_pruebas"
      GEMINI_API_KEY: "test_dummy_key"
      PORT: "3000"

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: monitor_test_db
        ports:
          - 5432:5432
        # Aseguramos que GitHub espere a que PostgreSQL esté listo
        options: >-
          --health-cmd "pg_isready -U test_user -d monitor_test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Generate prisma client
        run: npx prisma generate

      # 2. Paso activo: Esto viaja a la DB temporal vacía y crea la tabla Monitor
      - name: Push Prisma schema to test database
        run: npx prisma db push

      # 3. Jest ejecuta las pruebas encontrando las tablas listas
      - name: Run test suite
        run: npm test